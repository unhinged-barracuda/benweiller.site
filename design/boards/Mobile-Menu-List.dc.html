    // a parchment campaign (vicks) stays soft tan and beige: hue kept, saturation held low (0.18 to 0.42) instead of lifted, so no colour pops
    if (mono === 'tan') { const r = this.rng(seed + 77), o = sw.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = o[i]; o[i] = o[j]; o[j] = t; } const t = (hx, L, S) => { const c = this.hsl(hx); return this.hex(c[0], Math.min(S, Math.max(c[1], 0.18)), L); }; return [t(o[0], 0.86, 0.32), t(o[1 % o.length], 0.72, 0.42), t(o[2 % o.length], 0.5, 0.34), t(o[3 % o.length], 0.24, 0.24)]; }
    // a street campaign (heelys) keeps its greys and blacks true neutral instead of tinting them; its tan only ever sits light (halo or accent) so it never turns brown, its teal takes the halo or body, and the core is always near-black
    if (mono === 'ink') { const r = this.rng(seed + 77), hs = (h) => this.hsl(h), c = sw.filter((h) => hs(h)[1] >= 0.15), n = sw.filter((h) => hs(h)[1] < 0.15); const warm = c.filter((h) => hs(h)[0] >= 15 && hs(h)[0] <= 70), cool = c.filter((h) => !(hs(h)[0] >= 15 && hs(h)[0] <= 70)); const lightN = n.slice().sort((a, b) => hs(b)[2] - hs(a)[2])[0] || '#D6D4D0'; const tone = (hx, L, Smin, Smax) => { const h = hs(hx); return this.hex(h[0], Math.min(Smax, Math.max(h[1], Smin)), L); }; const tan = (L) => warm.length ? tone(warm[0], L, 0.22, 0.38) : this.hex(0, 0, L), teal = (L) => cool.length ? tone(cool[0], L, 0.4, 0.62) : this.hex(0, 0, L); return r() > 0.5 ? [tan(0.8), this.hex(0, 0, Math.min(0.86, hs(lightN)[2])), teal(0.42), this.hex(0, 0, 0.08)] : [teal(0.72), tan(0.78), this.hex(0, 0, 0.2), this.hex(0, 0, 0.07)]; }
    if (mono) { const r = this.rng(seed + 77), g = (L) => this.hex(0, 0, L), o = [0.95, 0.66, 0.4, 0.08]; for (let i = 3; i > 1; i--) { const j = 1 + Math.floor(r() * i); const t = o[i]; o[i] = o[j]; o[j] = t; } return o.map(g); }
    const r = this.rng(seed + 77), o = sw.slice();
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = o[i]; o[i] = o[j]; o[j] = t; }
