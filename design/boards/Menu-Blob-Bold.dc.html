<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { seed: Math.floor(Math.random() * 1e6), hover: null, shownId: 'w0', front: 'w0', back: 'w0', top: 'front', fade: true, kia: false, shown: true, listOpen: false, moreOpen: false, openG: false };
    this.t = null; this.lt = null; this.kt = null; this.raf = null;
  }
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.lt); clearTimeout(this.kt); cancelAnimationFrame(this.raf); }
  kiaOpen() { clearTimeout(this.kt); if (!this.state.kia) this.setState({ kia: true }); }
  kiaClose() { clearTimeout(this.kt); this.kt = setTimeout(() => this.setState({ kia: false }), 450); }
  rng(seed) {
    let a = seed >>> 0;
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  blob(seed, cx, cy, rx, ry, wob, n) {
    const r = this.rng(seed), harm = [];
    for (let k = 2; k <= 5; k++) harm.push({ k: k, a: (r() * 2 - 1) * wob / (k * 0.7), p: r() * 6.283 });
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * 6.283; let f = 1;
      harm.forEach((h) => { f += h.a * Math.sin(h.k * t + h.p); });
      pts.push([cx + Math.cos(t) * rx * f, cy + Math.sin(t) * ry * f]);
    }
    let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + ' Z';
  }
  // homepage-style shape: rotated, with its own proportions and 2nd–6th lobes of varying strength, so every layer has a different character
  vblob(seed, cx, cy, rx, ry, n) {
    const r = this.rng(seed), harm = [];
    const rot = (r() - 0.5) * 2.2, sx = 0.75 + r() * 0.55, sy = 0.75 + r() * 0.55, wob = 0.22 + r() * 0.34;
    for (let k = 2; k <= 6; k++) {
      const a0 = (r() * 2 - 1) * wob / (k * 0.7);
      harm.push({ k: k, a: a0 * (1 + 0.45 * Math.sin(k * 1.7 + r() * 3)) + (r() < 0.35 ? (0.08 + r() * 0.08) / k : 0), p: r() * 6.283 });
    }
    const pts = [], c = Math.cos(rot), sn = Math.sin(rot);
    for (let i = 0; i < n; i++) {
      const t = (i / n) * 6.283; let f = 1;
      harm.forEach((h) => { f += h.a * Math.sin(h.k * t + h.p); });
      f = Math.max(0.35, f);
      const x = Math.cos(t) * rx * sx * f, y = Math.sin(t) * ry * sy * f;
      pts.push([cx + x * c - y * sn, cy + x * sn + y * c]);
    }
    let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + ' Z';
  }
  mix(h1, h2, t) {
    const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    const c = (sh) => Math.round(((a >> sh) & 255) * (1 - t) + ((b >> sh) & 255) * t);
    return 'rgb(' + c(16) + ',' + c(8) + ',' + c(0) + ')';
  }
  show(id) {
    clearTimeout(this.lt);
    const s = this.state;
    if (id === s.shownId) { this.setState({ hover: id }); return; }
    // the card stays: the new campaign is laid on top of the old one and fades in, so the card is never empty
    const top = s.top === 'front' ? 'back' : 'front';
    const patch = { hover: id, shownId: id, top: top, fade: false };
    patch[top] = id;
    this.setState(patch);
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(() => { this.raf = requestAnimationFrame(() => this.setState({ fade: true })); });
  }
  off() { clearTimeout(this.lt); this.lt = setTimeout(() => this.setState({ hover: null }), 120); }
  // hex <-> hsl helpers for thumbnail palettes
  hsl(hex) {
    const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    let h = 0, s = 0;
    if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    return [h, s, l];
  }
  hex(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    const t = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + t(r) + t(g) + t(b);
  }
  thumbPal(sw, seed, mono) {
