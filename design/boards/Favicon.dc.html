<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Dirtbag TM';src:url('/_blob/a15098c6e2313273da5b37f609489781') format('opentype');font-weight:400;font-style:normal;font-display:swap}
body{margin:0}
.bw{font-family:'Dirtbag TM','Inter',sans-serif;line-height:1;letter-spacing:0.01em;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.lbl{margin:10px 0 0;font-size:11px;color:#8A8A82;text-align:center}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 900px; overflow: hidden; background: #F1F1EE; color: #1E1E1C; font-family: 'Inter', system-ui, sans-serif">
<svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none"><filter id="fGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0.10 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#fGrain)"></rect></svg>

<!-- alt · bloburblur: the BW in white over the homepage blob (lilac halo, teal core, grain), for profile pictures (vimeo etc.). letters centred on their ink, sized to sit inside a circle crop -->
<aside aria-label="Favicon alt · bloburblur" style="position: absolute; z-index: 1; top: 64px; right: 4vw; display: flex; flex-direction: column; gap: 32px">
<figure style="margin: 0">
<img src="/_blob/7abbd2cc2379f7084e74f61625168932" alt="BW in white over a teal blob with a lilac halo" style="display: block; width: 256px; height: 256px">
<figcaption class="lbl">alt · bloburblur</figcaption>
</figure>
<figure style="margin: 0">
<img src="/_blob/7abbd2cc2379f7084e74f61625168932" alt="" aria-hidden="true" style="display: block; width: 256px; height: 256px; border-radius: 50%">
<figcaption class="lbl">alt · as a profile picture (circle crop)</figcaption>
</figure>
</aside>

<div style="position: relative; z-index: 1; padding: 64px 4vw; display: flex; flex-direction: column; gap: 72px">

<!-- master tiles -->
<section aria-label="Favicon masters" style="display: flex; gap: 64px; align-items: flex-end">
<figure style="margin: 0">
<div class="bw" style="width: 256px; height: 256px; background: #F1F1EE; color: #1E1E1C; font-size: 150px; border-radius: 0; box-shadow: 0 0 0 1px rgba(30,30,28,0.12)">BW</div>
<figcaption class="lbl">primary · ink on ground</figcaption>
</figure>
<figure style="margin: 0">
<div class="bw" style="width: 256px; height: 256px; background: #1E1E1C; color: #F1F1EE; font-size: 150px">BW</div>
<figcaption class="lbl">reverse · for dark tabs</figcaption>
</figure>
<figure style="margin: 0">
<div class="bw" style="width: 256px; height: 256px; background: #F1F1EE; color: #1E1E1C; font-size: 150px; border-radius: 56px; box-shadow: 0 0 0 1px rgba(30,30,28,0.12)">BW</div>
<figcaption class="lbl">app / home-screen icon (rounded by the device)</figcaption>
</figure>
</section>

<!-- true sizes -->
<section aria-label="Actual sizes" style="display: flex; gap: 48px; align-items: flex-end">
<figure style="margin: 0"><div class="bw" style="width: 180px; height: 180px; background: #F1F1EE; font-size: 104px; box-shadow: 0 0 0 1px rgba(30,30,28,0.12)">BW</div><figcaption class="lbl">180 · apple touch</figcaption></figure>
<figure style="margin: 0"><div class="bw" style="width: 64px; height: 64px; background: #F1F1EE; font-size: 37px; box-shadow: 0 0 0 1px rgba(30,30,28,0.12)">BW</div><figcaption class="lbl">64</figcaption></figure>
<figure style="margin: 0"><div class="bw" style="width: 32px; height: 32px; background: #F1F1EE; font-size: 22px; box-shadow: 0 0 0 1px rgba(30,30,28,0.12)">BW</div><figcaption class="lbl">32</figcaption></figure>
<figure style="margin: 0"><div class="bw" style="width: 16px; height: 16px; background: #F1F1EE; font-size: 12px; box-shadow: 0 0 0 1px rgba(30,30,28,0.12)">BW</div><figcaption class="lbl">16 · glyph enlarged to fill</figcaption></figure>
<figure style="margin: 0"><div class="bw" style="width: 32px; height: 32px; background: #1E1E1C; color: #F1F1EE; font-size: 22px">BW</div><figcaption class="lbl">32 rev</figcaption></figure>
<figure style="margin: 0"><div class="bw" style="width: 16px; height: 16px; background: #1E1E1C; color: #F1F1EE; font-size: 12px">BW</div><figcaption class="lbl">16 rev</figcaption></figure>
</section>

<!-- in a browser tab -->
<section aria-label="In a browser tab" style="display: flex; gap: 32px; flex-wrap: wrap">
<figure style="margin: 0">
<div style="width: 420px; height: 44px; background: #DEDDD8; display: flex; align-items: flex-end; padding: 0 10px; box-sizing: border-box">
<div style="height: 34px; width: 230px; background: #FFFFFF; border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; font-size: 12px; color: #333">
<span class="bw" style="width: 16px; height: 16px; background: #F1F1EE; color: #1E1E1C; font-size: 12px; flex: none">BW</span>Ben Weiller
</div>
</div>
<figcaption class="lbl">light browser</figcaption>
</figure>
<figure style="margin: 0">
<div style="width: 420px; height: 44px; background: #202124; display: flex; align-items: flex-end; padding: 0 10px; box-sizing: border-box">
<div style="height: 34px; width: 230px; background: #35363A; border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; font-size: 12px; color: #E8E8E8">
<span class="bw" style="width: 16px; height: 16px; background: #F1F1EE; color: #1E1E1C; font-size: 12px; flex: none">BW</span>Ben Weiller
</div>
</div>
<figcaption class="lbl">dark browser · the ground tile keeps it visible</figcaption>
</figure>
</section>
</div>
</div>
</x-dc>

</html>
